[project]
name = "stats-utils"
version = "0.1.0"
description = "A collection of hand-built statistics utilities for A/B tests and quasi-experiments."
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { file = "LICENSE" }
authors = [
  { name = "Daniel O'Keeffe", email = "dan.okeeffe@shopify.com" },
]
dependencies = [
  "matplotlib>=3.6,<4",
  "multiprocess>=0.70,<1",
  "numpy>=1.23,<2",
  "pandas>=1.5,<3",
  "pmdarima>=2,<3",
  "pycausalimpact>=0.1,<1",
  "scipy>=1.10,<2",
  "seaborn>=0.12,<1",
  "statsmodels>=0.13,<1",
  "tqdm>=4.60,<5",
]

[project.optional-dependencies]
notebooks = [
  "ipykernel>=6,<7",
  "jupyterlab>=4,<5",
]

[dependency-groups]
dev = [
  "pytest>=8,<9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
  "ab_testing_utils",
  "quasi_experiment_utils",
]
